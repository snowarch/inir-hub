name: Publish

# The catalogue is served from inir.space/hub: inir-site's deploy builds it from this repo. The SITE_DISPATCH_TOKEN
# secret (a fine-grained token on snowarch/inir-site with Contents: read and write) asks for that deploy at once, and a
# token that stopped working fails this run instead of passing in silence. Without it the site's own schedule picks
# main up, which GitHub runs late (hours, measured 11-03), so the token is the path that counts.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - name: Ask inir.space to deploy
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::No SITE_DISPATCH_TOKEN: inir.space picks this commit up only on its scheduled build, which GitHub runs hours late."
            exit 0
          fi
          gh api repos/snowarch/inir-site/dispatches -f event_type=hub-updated
          echo "inir.space is deploying ${GITHUB_SHA::7}"
