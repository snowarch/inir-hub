name: Publish

# The catalogue is served from inir.space/hub: inir-site's deploy builds it from this repo. Its deploy looks at this
# repo's main every 20 minutes and builds when main moved, so a merge reaches people with no token at all. With the
# SITE_DISPATCH_TOKEN secret (a fine-grained token on snowarch/inir-site with Contents: read and write) a merge asks
# for the deploy at once; a token that stopped working fails this run instead of passing in silence.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - name: Ask inir.space to deploy
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::No SITE_DISPATCH_TOKEN: inir.space's deploy picks this commit up on its next look (every 20 minutes)."
            exit 0
          fi
          gh api repos/snowarch/inir-site/dispatches -f event_type=hub-updated
          echo "inir.space is deploying ${GITHUB_SHA::7}"
