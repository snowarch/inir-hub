name: Publish

# The catalogue is served from inir.space/hub: inir-site's deploy builds it from this repo on every deploy (and
# daily). A merge here asks it to deploy now when the SITE_DISPATCH_TOKEN secret (a token that can dispatch to
# snowarch/inir-site) is set; without it the next daily build picks the change up.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - name: Ask inir.space to deploy
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "no SITE_DISPATCH_TOKEN: the daily site build publishes this"; exit 0; fi
          gh api repos/snowarch/inir-site/dispatches -f event_type=hub-updated
