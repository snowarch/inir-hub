name: Check

# What a pull request must pass before the reviewer reads it (merge.yml), and what main must keep. `inir hub check` runs the same
# rules on the author's machine (CONTRIBUTING.md): an item that passes there passes here. Every step reports even
# when one before it failed, so one run lists everything to fix.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: The inir command (its hub verbs check and build the catalogue)
        # inir-cli straight from GitHub (the module proxy can serve the commit before a new rule for a few minutes);
        # its dependencies still through the proxy and checksum database
        env:
          GOPRIVATE: github.com/snowarch/inir-cli
        run: go install github.com/snowarch/inir-cli/cmd/inir@main
      - name: The reviewer's card for each changed item
        if: always() && github.event_name == 'pull_request'
        run: |
          dirs=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | cut -d/ -f1-2 | sort -u |
            while read -r d; do if [ -f "$d/hub.json" ]; then echo "$d"; fi; done)
          [ -z "$dirs" ] || inir hub audit --markdown $dirs >> "$GITHUB_STEP_SUMMARY" || true
      - name: The pull request (one item, its own lane, version raised, IPC documented, every language whole, tokens)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        # Families change only from the people who keep the hub; everyone else adds a component worn with one.
        env:
          MAINTAINER: ${{ contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) && '--maintainer' || '' }}
        run: inir hub check --base "origin/${{ github.base_ref }}" $MAINTAINER
      # Main is what everyone downloads: an item asking a newer iNiR than main's fails to install for all of them
      # (11-12: families asking 3.0.2 while main was 3.0.1). Release the base first, then raise minInir.
      - name: No item asks a newer iNiR than main
        if: ${{ !cancelled() }}
        run: tools/min-inir.sh
      # The Qt iNiR runs on: qs-rs bundles 6.12.0 (qs-rs release.yml QT_VERSION); keep this pin in step with it. A file
      # that does not parse fails only when someone opens it, on every desktop that installed it.
      - uses: actions/setup-python@v6
        if: ${{ !cancelled() }}
        with:
          python-version: "3.13"
      - name: Every QML file parses
        if: ${{ !cancelled() }}
        run: |
          pip install --quiet --no-deps "PySide6-Essentials==6.12.0" "shiboken6==6.12.0"
          broken=$(find families components designs widgets templates -name '*.qml' -print0 2>/dev/null |
            xargs -0 -n 60 -P 4 pyside6-qmllint --bare 2>&1 | grep -a '\[syntax\]' | sort -u || true)
          if [ -n "$broken" ]; then
            echo "$broken" | sed -E 's/^Warning: ([^:]+):([0-9]+):[0-9]+: (.*)$/::error file=\1,line=\2::\3/'
            exit 1
          fi
          echo "every QML file parses"
      - name: Validate every item
        if: ${{ !cancelled() }}
        run: inir hub validate
      - name: Build
        if: ${{ !cancelled() }}
        run: inir hub build --out "$RUNNER_TEMP/dist"
