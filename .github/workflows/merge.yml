name: Merge

# Acceptance by risk, once Check passes. This never checks out the pull request's code: it reads the changed files and
# the item's hub.json (as data) from the API.
#   - Data (a colour theme, an iRiS theme, a web app): nothing in it runs on anyone's desktop. Merges by itself.
#   - An update to a widget, component or Design by one of the authors its hub.json on main lists, asking for no
#     permission or host it didn't already have: people already trust that author with that item. Merges by itself.
#   - Anything else (a new code item, more permissions, someone else's item, families, the tools) waits for one
#     maintainer, and the pull request says so and why.
on:
  workflow_run:
    workflows: [Check]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  accept:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.decide.outputs.merged }}
    steps:
      - name: Merge what needs no maintainer
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
        run: |
          pr=$(gh api "repos/$REPO/pulls?state=open&head=$OWNER:$BRANCH" --jq ".[] | select(.head.sha == \"$SHA\") | .number" | head -1)
          [ -n "$pr" ] || { echo "no open pull request at $SHA"; exit 0; }
          author=$(gh api "repos/$REPO/pulls/$pr" --jq '.user.login' | tr 'A-Z' 'a-z')
          files=$(gh api --paginate "repos/$REPO/pulls/$pr/files" --jq '.[].filename')
          items=$(echo "$files" | grep -v '^docs/' | cut -d/ -f1-2 | sort -u)
          # One comment per pull request, edited when the reason changes: a new one on every push pinged the author each time
          hold() {
            echo "#$pr: $1"
            body="Check passed. $1, so a maintainer merges it; the reviewer's card is in the Check run's summary."
            id=$(gh api --paginate "repos/$REPO/issues/$pr/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("Check passed."))) | .id' | tail -n 1)
            if [ -z "$id" ]; then
              gh pr comment "$pr" --repo "$REPO" --body "$body"
            elif [ "$(gh api "repos/$REPO/issues/comments/$id" --jq .body)" != "$body" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null
            fi
            exit 0
          }
          [ "$(echo "$items" | wc -l)" = 1 ] || hold "It changes more than one item ($(echo "$items" | tr '\n' ' '))"
          echo "$items" | grep -Eq '^(themes|iris-themes|webapps|widgets|components|designs)/[a-z0-9-]+$' ||
            hold "It changes $items, which only maintainers change"
          kind=${items%%/*} id=${items#*/}
          [ -z "$(echo "$files" | grep '^docs/' | grep -v "^docs/$id/" || true)" ] || hold "It touches another item's docs"
          case "$kind" in
            themes|iris-themes|webapps) why="$items is data only" ;;
            *)
              # empty when the file is not there: gh prints the 404's JSON on stdout, which read as a hub.json without authors
              raw() { local out; out=$(gh api -H "Accept: application/vnd.github.raw" "repos/$REPO/contents/$items/hub.json?ref=$1" 2>/dev/null) && printf '%s' "$out"; return 0; }
              was=$(raw main) now=$(raw "$SHA")
              [ -n "$was" ] || hold "$items is new code that will run on people's desktops"
              echo "$was" | jq -e --arg a "$author" '[.authors[]? | ascii_downcase] | index($a)' >/dev/null ||
                hold "@$author is not among the authors of $items"
              grown=$(jq -rn --argjson was "$was" --argjson now "$now" \
                '[(($now.permissions // []) - ($was.permissions // []))[], (($now.hosts // []) - ($was.hosts // []))[]] | join(", ")')
              [ -z "$grown" ] || hold "It asks for more than $items had ($grown)"
              why="an update by its author with no new permission"
              ;;
          esac
          gh pr merge "$pr" --repo "$REPO" --squash --match-head-commit "$SHA"
          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "#$pr merged: $why, and it passed Check"
      - name: Ask inir.space to deploy
        # A merge made by this workflow's token starts no other workflow, so Publish would not run.
        if: steps.decide.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          [ -z "$GH_TOKEN" ] || gh api repos/snowarch/inir-site/dispatches -f event_type=hub-updated
