name: An item doesn't work
description: Something from the Hub installs, shows or behaves wrong.
labels: [bug]
body:
  - type: input
    id: item
    attributes:
      label: Item
      description: Its id, as in `inir hub install <id>`.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: iNiR version and family
      description: "`inir version`, and Material, iRiS or Waffle."
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected, what you saw.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`inir logs --issues` right after it happens."
      render: text
